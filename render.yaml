services:
  - type: web
    name: plugify-store
    runtime: static
    branch: plugify-store
    buildCommand: rm -rf app dist && mkdir -p app && unzip -q plugify-store-deploy.zip -d app && cd app && npm install && npm run build && cp -r dist ../dist
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
